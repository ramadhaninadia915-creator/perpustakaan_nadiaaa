<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Perpustakaan Soft Pink</title>
    <style>
        /* --- Style Dasar Estetik Soft Pink --- */
        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff0f3; /* Latar belakang Pink Soft super lembut */
            margin: 0;
            padding: 0;
            color: #4a373a; /* Warna teks cokelat gelap keunguan agar senada dengan pink */
        }

        header {
            background-color: #ffb3c1; /* Warna Pink Pastel untuk Header */
            color: #4a373a;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(255, 179, 193, 0.2);
        }

        .container {
            padding: 40px;
            max-width: 1300px;
            margin: 0 auto;
        }

        /* --- Profil Admin Estetik --- */
        .profile-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            text-align: left;
            margin-right: 10px;
        }

        .profile-name {
            font-size: 14px;
            font-weight: 600;
        }

        .profile-role {
            font-size: 11px;
            opacity: 0.8;
        }

        /* --- Style Form Login (Modal Modern) --- */
        .login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 240, 243, 0.7); /* Latar belakang overlay pink transparan */
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-box {
            background: white;
            padding: 40px 35px;
            border-radius: 20px;
            width: 340px;
            box-shadow: 0 20px 40px rgba(255, 143, 163, 0.15); /* Bayangan soft pink halus */
            text-align: center;
            border: 1px solid #ffe5ec;
        }

        /* Gambar Profil Perpustakaan di Login */
        .login-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #ffe5ec;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            box-shadow: 0 8px 15px rgba(255, 179, 193, 0.3);
        }

        .login-box h2 { margin-top: 5px; color: #ff758f; font-weight: 700; font-size: 22px; }

        /* --- Style Form & Input Minimalis --- */
        label {
            font-size: 13px;
            font-weight: 600;
            color: #805b61;
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
        }

        input[type="text"], input[type="number"], input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            margin: 4px 0 12px 0;
            box-sizing: border-box;
            border: 1.5px solid #ffe5ec;
            border-radius: 12px;
            background-color: #fff0f3;
            transition: all 0.2s;
            font-size: 14px;
            color: #4a373a;
        }

        input[type="text"]:focus, input[type="number"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #ff758f;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(255, 117, 143, 0.15);
        }

        .btn {
            padding: 11px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }

        /* Tombol Masuk: Background Putih, Teks Pink Soft */
        .btn-login { 
            background-color: #ffffff; 
            color: #ff758f; 
            width: 100%; 
            padding: 12px; 
            margin-top: 15px;
            border: 2px solid #ff758f;
            box-shadow: 0 4px 10px rgba(255, 117, 143, 0.1);
        }
        .btn-login:hover { 
            background-color: #ff758f; 
            color: #ffffff; 
        }
        
        .btn-success { background-color: #ff758f; color: white; } /* Tombol Simpan Pink Cerah */
        .btn-success:hover { background-color: #ff4d6d; }
        
        .btn-warning { background-color: #ffb3c1; color: #4a373a; }
        .btn-warning:hover { background-color: #ff85a1; }
        
        .btn-danger { background-color: #ff4d6d; color: white; }
        .btn-danger:hover { background-color: #c9184a; }
        
        .btn-secondary { background-color: rgba(255,255,255,0.4); color: #4a373a; border: 1px solid rgba(255,255,255,0.6); }
        .btn-secondary:hover { background-color: rgba(255,255,255,0.6); }
        
        .btn-table-batal { background-color: #a3a3a3; color: white; }

        /* --- Layout Utama Konten --- */
        .main-content {
            display: none;
        }

        .flex-container {
            display: flex;
            gap: 35px;
            margin-top: 10px;
        }

        .panel-form
